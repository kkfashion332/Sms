<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>M.K. Industry Chatting App</title>
    <style>
        /* Dark Golden Premium Theme */
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            padding: 20px; 
            background-color: #0d0d0d; /* Pure dark background */
            color: #d4af37; /* Classic Gold */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 95vh;
            margin: 0;
        }

        .chat-container {
            width: 100%;
            max-width: 500px;
            background: #1a1a1a;
            border-radius: 15px;
            border: 1px solid #d4af37;
            box-shadow: 0 8px 32px rgba(212, 175, 55, 0.2);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .header {
            background: linear-gradient(135deg, #1a1a1a, #2b220d);
            padding: 15px;
            text-align: center;
            border-bottom: 2px solid #d4af37;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
        }

        .logo {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border: 2px solid #d4af37;
            box-shadow: 0 0 10px #d4af37;
            object-fit: cover;
        }

        .header h2 {
            margin: 0;
            font-size: 20px;
            color: #d4af37;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        #chat-box { 
            height: 400px; 
            overflow-y: auto; 
            padding: 20px; 
            background-color: #121212;
            scroll-behavior: smooth;
        }

        /* Custom Scrollbar for Chat box */
        #chat-box::-webkit-scrollbar {
            width: 6px;
        }
        #chat-box::-webkit-scrollbar-thumb {
            background: #d4af37; 
            border-radius: 10px;
        }

        .msg-container { 
            width: 100%; 
            margin-bottom: 15px;
            display: flex;
        }

        .msg { 
            padding: 12px 18px; 
            background: linear-gradient(145deg, #262626, #1c1c1c); 
            color: #f1f1f1;
            border-radius: 0px 15px 15px 15px; 
            border-left: 4px solid #d4af37;
            max-width: 75%;
            word-wrap: break-word;
            box-shadow: 2px 2px 8px rgba(0,0,0,0.4);
            font-size: 15px;
            line-height: 1.4;
        }

        .input-area {
            display: flex;
            padding: 15px;
            background: #1a1a1a;
            border-top: 1px solid rgba(212, 175, 55, 0.3);
            gap: 10px;
        }

        input { 
            flex: 1; 
            padding: 12px 15px; 
            background: #0d0d0d;
            border: 1px solid #d4af37; 
            color: #d4af37;
            border-radius: 25px; 
            outline: none;
            font-size: 15px;
            transition: all 0.3s ease;
        }

        input::placeholder {
            color: rgba(212, 175, 55, 0.5);
        }

        input:focus {
            box-shadow: 0 0 10px rgba(212, 175, 55, 0.4);
        }

        button { 
            padding: 12px 25px; 
            background: linear-gradient(145deg, #d4af37, #997a00); 
            color: #0d0d0d; 
            border: none; 
            border-radius: 25px; 
            cursor: pointer; 
            font-weight: bold;
            font-size: 15px;
            text-transform: uppercase;
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.4);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(212, 175, 55, 0.6);
        }
        
        button:active {
            transform: translateY(1px);
        }
    </style>
</head>
<body>

    <div class="chat-container">
        <!-- Header Section with Logo and App Name -->
        <div class="header">
            <!-- Maine yahan generated image ko placeholder ki tarah 'watermarked_img_17172730261004140550.png' likha hai. 
                 Agar aap logo download karke 'logo.png' rakhte hain toh yahan src="logo.png" kar dijiyega -->
            <img src="watermarked_img_17172730261004140550.png" alt="M.K. Logo" class="logo" onerror="this.src='https://via.placeholder.com/50/d4af37/000000?text=MK'">
            <h2>M.K. Industry</h2>
        </div>

        <div id="chat-box"></div>
        
        <div class="input-area">
            <input type="text" id="message-input" placeholder="Type a premium message...">
            <button id="send-btn">Send</button>
        </div>
    </div>

    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, push, onChildAdded } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        // Aapki Firebase Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyCmdJQ_giCdWhMPuxQ-U71gLLzTAg00LaQ",
            authDomain: "st-online-shopping-website.firebaseapp.com",
            databaseURL: "https://st-online-shopping-website-default-rtdb.firebaseio.com",
            projectId: "st-online-shopping-website",
            storageBucket: "st-online-shopping-website.firebasestorage.app",
            messagingSenderId: "194029306054",
            appId: "1:194029306054:web:ae1fa295213e0bfe5757c7"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const messagesRef = ref(db, 'messages'); 

        const chatBox = document.getElementById('chat-box');
        const messageInput = document.getElementById('message-input');
        const sendBtn = document.getElementById('send-btn');

        function sendMessage() {
            const text = messageInput.value;
            if(text.trim() !== "") {
                push(messagesRef, {
                    text: text,
                    timestamp: Date.now()
                });
                messageInput.value = ""; 
            }
        }

        sendBtn.addEventListener('click', sendMessage);

        messageInput.addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });

        onChildAdded(messagesRef, (snapshot) => {
            const data = snapshot.val();
            
            const container = document.createElement('div');
            container.className = 'msg-container';
            
            const msgDiv = document.createElement('div');
            msgDiv.className = 'msg';
            msgDiv.innerText = data.text;
            
            container.appendChild(msgDiv);
            chatBox.appendChild(container);
            
            chatBox.scrollTop = chatBox.scrollHeight; 
        });
    </script>
</body>
</html>
